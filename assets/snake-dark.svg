<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 220" role="img" aria-label="Decorative contribution snake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0a101f"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="none"/>
      <rect x="2" y="2" width="14" height="14" rx="3" fill="#2a3242"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 0.13 0 1 0 0 0.82 0 0 1 0 0.93 0 0 0 1 0"/>
    </filter>
  </defs>

  <rect width="1024" height="220" rx="10" fill="url(#bg)"/>
  <rect x="24" y="26" width="976" height="126" fill="url(#grid)" opacity="0.92"/>

  <g filter="url(#glow)" opacity="0.95">
    <circle r="7" fill="#22d3ee">
      <animateMotion dur="18s" repeatCount="indefinite" keyTimes="0;1" keySplines="0.4 0 0.2 1" calcMode="spline">
        <mpath href="#snakePath"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="#2dd4bf" opacity="0.95">
      <animateMotion dur="18s" begin="-0.8s" repeatCount="indefinite">
        <mpath href="#snakePath"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#38bdf8" opacity="0.9">
      <animateMotion dur="18s" begin="-1.6s" repeatCount="indefinite">
        <mpath href="#snakePath"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#67e8f9" opacity="0.85">
      <animateMotion dur="18s" begin="-2.4s" repeatCount="indefinite">
        <mpath href="#snakePath"/>
      </animateMotion>
    </circle>
  </g>

  <path id="snakePath" d="M 60 62
    H 956
    V 80
    H 60
    V 98
    H 956
    V 116
    H 60
    V 134
    H 956" fill="none" stroke="none"/>
</svg>
